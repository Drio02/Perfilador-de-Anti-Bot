version: 1

vendors:
  - id: cloudflare
    name: Cloudflare
    signals:
    - type: header_present
      key: cf-ray
      weight: 0.4
      implies_role: cdn
    - type: header_value
      key: server
      value: cloudflare
      weight: 0.3
      implies_role: cdn
    - type: cookie_present
      key: __cf_bm
      weight: 0.5
      implies_role: bot_defense
    - type: header_present
      key: cf-mitigated
      weight: 0.6
      implies_role: bot_defense
      enforcement: true
    - type: body_contains
      value: "Checking your browser"
      weight: 0.3
      implies_role: bot_defense
      enforcement: true
  - id: datadome
    name: DataDome
    signals:
    - type: header_value
      key: x-datadome
      value: protected
      weight: 0.7
      implies_role: bot_defense
      enforcement: true
    - type: header_present
      key: x-datadome-cid
      weight: 0.5
      implies_role: bot_defense
    - type: cookie_present
      key: datadome
      weight: 0.5
      implies_role: bot_defense
    - type: header_present
      key: x-dd-b
      weight: 0.4
      implies_role: bot_defense
  
  - id: akamai
    name: Akamai
    signals:
    - type: cookie_present
      key: _abck
      weight: 0.6
      implies_role: bot_defense
      enforcement: true
    - type: cookie_present
      key: bm_sz
      weight: 0.4
      implies_role: bot_defense
    - type: header_value
      key: server
      value: AkamaiGHost
      weight: 0.4
      implies_role: cdn

  - id: perimeterx
    name: PerimeterX / HUMAN
    signals:
    - type: cookie_present
      key: _px3
      weight: 0.6
      implies_role: bot_defense
      enforcement: true
    - type: cookie_present
      key: _pxhd
      weight: 0.4
      implies_role: bot_defense
    - type: header_present
      key: x-px
      weight: 0.4
      implies_role: bot_defense
 
  - id: imperva
    name: Imperva / Incapsula
    signals:
    - type: cookie_present
      key: incap_ses
      weight: 0.5
      implies_role: bot_defense
      enforcement: true
    - type: cookie_present
      key: visid_incap
      weight: 0.4
      implies_role: bot_defense
    - type: header_value
      key: x-cdn
      value: Imperva
      weight: 0.5
      implies_role: cdn

